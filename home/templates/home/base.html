<!DOCTYPE html>
{% load static %}
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Amazon Clone{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
    <link rel="stylesheet" href="{% static 'css/amazonclone.css' %}">
</head>

<body>

    <nav class="navBar">
        <div class="navBarrow row w-100">
            <div class="col-3 leftsection">
                <a href="{% url 'index' %}">
                    <img src="https://logos-world.net/wp-content/uploads/2020/04/Amazon-Logo.png" alt="Amazon Logo" />
                </a>
            </div>

            <div class="col-6 navSearchBar">
                <form action="{% url 'buscar' %}" method="GET" class="itemSearchBar w-100"
                    style="display: flex; align-items: center;">
                    <i class="fas fa-search" style="margin-right: 10px;"></i>
                    <input placeholder="Buscar productos" type="search" name="q" value="{{ request.GET.q }}"
                        style="flex-grow: 1; border: none; outline: none;" />
                    <button type="submit" hidden></button>
                </form>
            </div>

            <div class="col-3 navLast">
                <div class="cart">
                    <a href="{% url 'carrito:carritoDetalle' %}">
                        <img src="https://www.x1.com/wp-content/uploads/2018/09/Shopping-cart-icon.png" alt="" />
                        <b>Carrito</b>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <div class="navOptions">
        <a href="{% url 'index' %}"><i class="fas fa-bars"></i> Todo</a>
        <a href="{% url 'mas_vendidos:index' %}">Los Más Vendidos</a>
        <a href="{% url 'moviles:index' %}">Móviles</a>
        <a href="{% url 'electronica:index' %}">Electrónica</a>
        <a href="{% url 'moda:index' %}">Moda</a>
        <a href="{% url 'computadoras:index' %}">Computadoras</a>
        <a href="{% url 'hogar:index' %}">Hogar</a>
        <a href="{% url 'Contacto' %}">¡Contacto!</a>
    </div>

    <div class="main-content-wrapper">
        {% block content %}
        {% endblock %}
    </div>


    <div class="amazonBio">
        <div class="logamazon">
            <img src="https://logos-world.net/wp-content/uploads/2020/04/Amazon-Logo.png" alt="" style="width: 80px;" />
            <br>
            <p class="text-white mt-2 mb-0" style="font-size: 0.7rem;">&copy; 2025 Amazon Inc. Derechos reservados.
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
